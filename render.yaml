services:
  - type: web
    name: numforlife
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Must be 0.0.0.0 — do not leave unset (Linux HOSTNAME breaks Next listen)
      - key: HOSTNAME
        value: "0.0.0.0"
